name: N3XT
description: >-
  N3XT is a Wyoming state-chartered Special Purpose Depository Institution (SPDI)
  offering instant, 24/7/365 USD payment settlement for business-to-business
  transactions on blockchain rails. Its full-reserve narrow-bank model backs
  every deposit 1:1 with cash and short-term U.S. Treasuries (no lending), and
  it issues the N3XT Digital Dollar (NDD) — a bank-regulated tokenized deposit
  with an on-chain KYC/KYB Identity Passport (NDDID). The N3XT API is a holistic
  banking API for businesses covering wallets and public-wallet onboarding,
  instant and programmable payments, payment requests, internal transfers, NDD
  mint/redeem, contacts, approvals and audit trail. It ships OAuth 2.0
  authentication, Beta/Omega test environments, and a first-party hosted MCP
  server for AI/agent access.
